name: windows-build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: cargo test
      - name: Build
        run: cargo build --release
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: weekly-usage-bar-windows-x64
          path: target/release/weekly-usage-bar.exe
